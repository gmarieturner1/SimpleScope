<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Scope of Work</title>
<meta name="description" content="Foreman walkthrough, bid packages, and client quotes for flips, rentals, and construction jobs." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B3A5C" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Scope of Work" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="install-banner" class="no-print">
  <span>Install this on your device for offline access.</span>
  <div style="display:flex;gap:8px;">
    <button onclick="doInstall()">Install</button>
    <button onclick="dismissInstall()" style="background:none;color:white;border:1px solid white;">Not now</button>
  </div>
</div>
<div id="offline-banner" class="no-print" style="display:none;">You're offline — changes will sync once you're back online.</div>
<div id="app">
  <div style="padding:40px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#565E62;">Loading…</div>
</div>

<!-- Firebase (compat SDK — plain <script> tags, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
